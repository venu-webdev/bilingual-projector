# Builds the Windows and Linux downloads on GitHub's own machines and attaches them to a release.
# Publish a version:  git tag v0.1.0  &&  git push origin v0.1.0
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              release/Bilingual-Projector-Setup-x64.exe
              release/Bilingual-Projector-Portable-x64.exe
          - os: ubuntu-latest
            target: --linux
            files: |
              release/Bilingual-Projector-x86_64.AppImage
              release/Bilingual-Projector-amd64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Attach the downloads to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
